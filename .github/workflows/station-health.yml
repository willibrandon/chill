name: Station health

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

concurrency:
  group: station-health
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    # Only the default branch maintains the shared station-health issue.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.9.7
      - name: Install playback dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mpv
          python -m pip install --upgrade "yt-dlp[default]"
      - name: Build
        run: go build -v .
      - name: Audit and report persistent failures
        env:
          GH_TOKEN: ${{ github.token }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/chill-station-config
          XDG_RUNTIME_DIR: ${{ runner.temp }}/chill-station-runtime
        run: |
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_RUNTIME_DIR"
          python .github/scripts/station_health.py --publish
      - name: Save audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: station-health
          path: station-health/
          retention-days: 14
