name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        shell: bash
        run: |
          go vet ./...
          # git bash on Windows makes gofmt see CRLF in every file, so
          # check formatting on one platform only
          if [ "$RUNNER_OS" != Windows ]; then
            test -z "$(gofmt -l .)"
          fi

      - name: Build
        run: go build -v .

      - name: Test
        shell: bash
        run: go test ./...

      - name: Install mpv and yt-dlp (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y mpv
          pip install yt-dlp

      - name: Install mpv and yt-dlp (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install mpv yt-dlp

      - name: Install mpv and yt-dlp (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install mpv yt-dlp -y

      - name: Test mpv IPC with local audio
        env:
          CHILL_TEST_MPV: "1"
        run: go test -run TestMPVIntegration -v ./...

      - name: Test --list (Unix)
        if: matrix.os != 'windows-latest'
        run: ./chill --list

      - name: Test --list (Windows)
        if: matrix.os == 'windows-latest'
        run: .\chill.exe --list
        shell: pwsh

      - name: Test playback (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Start playing in background
          ./chill &
          sleep 5
          # Check status
          ./chill --status
          # Stop playback
          ./chill --stop
        shell: bash

      - name: Test playback (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # Start playing in background
          ./chill &
          sleep 5
          # Check status
          ./chill --status
          # Stop playback
          ./chill --stop
        shell: bash

      - name: Test playback (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          # Start playing in background
          Start-Process -FilePath ".\chill.exe" -NoNewWindow
          Start-Sleep -Seconds 5
          # Check status
          .\chill.exe --status
          # Stop playback
          .\chill.exe --stop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # mpv runs behind a launcher on Windows, make sure nothing was left playing
          Start-Sleep -Seconds 1
          if (Get-Process mpv -ErrorAction SilentlyContinue) { throw "mpv still running after --stop" }
        shell: pwsh
