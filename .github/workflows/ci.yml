name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'

      - name: Vet
        shell: bash
        run: |
          go vet ./...
          # git bash on Windows makes gofmt see CRLF in every file, so
          # check formatting on one platform only
          if [ "$RUNNER_OS" != Windows ]; then
            test -z "$(gofmt -l .)"
          fi

      - name: Build
        run: go build -v .

      - name: Test package release updater
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Install mpv (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mpv ffmpeg

      - name: Install mpv (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install mpv ffmpeg

      - name: Install mpv (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install mpv ffmpeg -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Chocolatey changes the registry PATH, not the Actions runner's
          # environment. Export mpv's directory for subsequent steps.
          $paths = ([Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')) -split ';'
          $mpvPaths = @($paths | Where-Object {
            $_ -and ((Test-Path (Join-Path $_ 'mpv.exe')) -or (Test-Path (Join-Path $_ 'mpv.com')) -or (Test-Path (Join-Path $_ 'ffmpeg.exe')))
          } | Select-Object -Unique)
          if ($mpvPaths.Count -eq 0) { throw 'mpv installation did not add an executable directory to PATH' }
          $mpvPaths | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install current yt-dlp
        run: python -m pip install --upgrade "yt-dlp[default]"

      - name: Verify playback dependencies
        shell: python
        run: |
          import shutil
          import subprocess
          for name in ("mpv", "yt-dlp", "ffmpeg"):
              executable = shutil.which(name)
              if executable is None:
                  raise RuntimeError(f"{name} not found on PATH")
              print(f"{name}: {executable}", flush=True)
              subprocess.run([executable, "-version" if name == "ffmpeg" else "--version"], check=True, timeout=30)

      - name: Test (including local audio playback)
        run: go test -count=1 -v ./...

      - name: Test --list (Unix)
        if: matrix.os != 'windows-latest'
        run: ./chill --list

      - name: Test --list (Windows)
        if: matrix.os == 'windows-latest'
        run: .\chill.exe --list
        shell: pwsh

      - name: Install previous release for upgrade test
        env:
          GOBIN: ${{ runner.temp }}/chill-legacy
        run: go install github.com/willibrandon/chill@v0.3.2

      - name: Verify daemon upgrade, playback, controls, and cleanup
        env:
          PYTHONUTF8: "1"
        run: python .github/scripts/playback.py --legacy-bin-dir "${{ runner.temp }}/chill-legacy"
