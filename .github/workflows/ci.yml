name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "1"

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'

      - name: Install pinned native Windows C compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = if ($env:RUNNER_ARCH -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
          $hash = if ($target -eq 'aarch64') { '7fe35f60407473c420ac72b25137f54385b0affd2c42efd507c0062fc626ab56' } else { '1bcf74d06b724aeecaa6412ca85f5b26fb1da770e7cdcefa9263c9c5c3ad34b6' }
          $name = "llvm-mingw-20260908-ucrt-$target"
          $archive = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest "https://github.com/mstorsjo/llvm-mingw/releases/download/20260908/$name.zip" -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne $hash) { throw 'Compiler checksum mismatch' }
          Expand-Archive $archive $env:RUNNER_TEMP
          "$env:RUNNER_TEMP/$name/bin" >> $env:GITHUB_PATH
          "CC=$target-w64-mingw32-clang" >> $env:GITHUB_ENV

      - name: Vet
        shell: bash
        run: |
          go vet ./...
          # git bash on Windows makes gofmt see CRLF in every file, so
          # check formatting on one platform only
          if [ "$RUNNER_OS" != Windows ]; then
            test -z "$(gofmt -l .)"
          fi

      - name: Build
        run: go build -v -tags chill_test_audio .

      - name: Test package release updater
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Install codec integration tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libasound2-dev pulseaudio

      - name: Install codec integration tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: Install codec integration tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $paths = ([Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')) -split ';'
          $paths | Where-Object { $_ -and (Test-Path (Join-Path $_ 'ffmpeg.exe')) } | Select-Object -Unique | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install current yt-dlp
        run: python -m pip install --upgrade "yt-dlp[default]"

      - name: Verify playback dependencies
        shell: python
        run: |
          import shutil
          import subprocess
          for name in ("yt-dlp", "ffmpeg", "ffprobe"):
              executable = shutil.which(name)
              if executable is None:
                  raise RuntimeError(f"{name} not found on PATH")
              print(f"{name}: {executable}", flush=True)
              subprocess.run([executable, "-version" if name in ("ffmpeg", "ffprobe") else "--version"], check=True, timeout=30)

      - name: Test (including local audio playback)
        run: go test -count=1 -v ./...

      - name: Test --list (Unix)
        if: runner.os != 'Windows'
        run: ./chill --list

      - name: Test --list (Windows)
        if: runner.os == 'Windows'
        run: .\chill.exe --list
        shell: pwsh

      - name: Race tests
        if: runner.os != 'Windows'
        run: go test -race ./...

      - name: Verify native Linux output
        if: runner.os == 'Linux'
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=chill_test
          ./chill doctor --audio --stream testdata/audio/tone.wav

      - name: Verify playback, controls, and cleanup
        env:
          PYTHONUTF8: "1"
        run: python .github/scripts/playback.py

  legacy-upgrade:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - name: Install historical backend only for upgrade compatibility
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mpv ffmpeg
          python -m pip install "yt-dlp[default]"
      - name: Build current test binary and previous release
        env:
          GOBIN: ${{ runner.temp }}/chill-legacy
        run: |
          go build -tags chill_test_audio .
          go install github.com/willibrandon/chill@v0.3.2
      - name: Verify old-to-new daemon upgrade
        run: python .github/scripts/playback.py --legacy-bin-dir "${{ runner.temp }}/chill-legacy"
