name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild the release assets for
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.TAG }}
          # the go command reads the version from the tag
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          # build outside the checkout, stray files would mark the version as +dirty
          out="$RUNNER_TEMP/out"
          mkdir -p "$out/dist"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name=chill_${TAG#v}_${os}_${arch}
            ext=""
            if [ "$os" = windows ]; then ext=".exe"; fi

            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "$out/$name/chill$ext" .
            cp README.md "$out/$name/"

            if [ "$os" = windows ]; then
              (cd "$out" && zip -qr "dist/$name.zip" "$name")
            else
              tar -C "$out" -czf "$out/dist/$name.tar.gz" "$name"
            fi
          done
          (cd "$out/dist" && sha256sum * > checksums.txt)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP"/out/dist/* --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP"/out/dist/* --title "$TAG" --generate-notes
          fi
