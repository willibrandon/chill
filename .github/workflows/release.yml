name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild the release assets for
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: chill-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      update_packages: ${{ steps.packages.outputs.enabled }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.TAG }}
          # the go command reads the version from the tag
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          # build outside the checkout, stray files would mark the version as +dirty
          out="$RUNNER_TEMP/out"
          mkdir -p "$out/dist"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            name=chill_${TAG#v}_${os}_${arch}
            ext=""
            if [ "$os" = windows ]; then ext=".exe"; fi

            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "$out/$name/chill$ext" .
            cp README.md "$out/$name/"

            if [ "$os" = windows ]; then
              (cd "$out" && zip -qr "dist/$name.zip" "$name")
            else
              tar -C "$out" -czf "$out/dist/$name.tar.gz" "$name"
            fi
          done
          (cd "$out/dist" && sha256sum * > checksums.txt)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP"/out/dist/* --clobber
          else
            args=(--title "$TAG" --generate-notes)
            if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$TAG" "$RUNNER_TEMP"/out/dist/* "${args[@]}"
          fi

      - name: Check package update eligibility
        id: packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          enabled=$(gh release view "$TAG" --json isDraft,isPrerelease --jq '(.isDraft or .isPrerelease) | not')
          if [[ "$TAG" == *-* ]]; then enabled=false; fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"

  update-homebrew:
    name: Update Homebrew tap
    needs: release
    if: ${{ needs.release.outputs.update_packages == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: chill-homebrew-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check out Homebrew tap
        uses: actions/checkout@v7.0.1
        with:
          repository: willibrandon/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Download release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt --dir "$RUNNER_TEMP"

      - name: Update formula
        run: |
          python3 .github/scripts/update_packages.py --tag "$TAG" \
            --checksums "$RUNNER_TEMP/checksums.txt" --homebrew homebrew-tap/Formula/chill.rb
          ruby -c homebrew-tap/Formula/chill.rb

      - name: Commit and push Homebrew tap
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/chill.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula is already current."
            exit 0
          fi
          git diff --cached --check
          git commit -m "Update chill to ${TAG#v}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1

  update-scoop:
    name: Update Scoop bucket
    needs: release
    if: ${{ needs.release.outputs.update_packages == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: chill-scoop-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check out Scoop bucket
        uses: actions/checkout@v7.0.1
        with:
          repository: willibrandon/scoop-bucket
          ref: main
          token: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          path: scoop-bucket

      - name: Download release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt --dir "$RUNNER_TEMP"

      - name: Update manifest
        run: |
          python3 .github/scripts/update_packages.py --tag "$TAG" \
            --checksums "$RUNNER_TEMP/checksums.txt" --scoop scoop-bucket/bucket/chill.json

      - name: Commit and push Scoop bucket
        working-directory: scoop-bucket
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/chill.json
          if git diff --cached --quiet; then
            echo "Scoop manifest is already current."
            exit 0
          fi
          git diff --cached --check
          git commit -m "Update chill to ${TAG#v}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
