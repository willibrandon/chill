name: macOS playback

# Requires an actual macOS audio device. Never replace output with a null sink.
# A CoreAudio process tap measures the built application independently.
on:
  workflow_dispatch:
    inputs:
      url:
        description: YouTube stream URL
        required: true
        default: https://www.youtube.com/watch?v=5yx6BWlEVcY
      stations:
        description: Also check resolution of every built-in station
        type: boolean
        default: true

jobs:
  playback:
    runs-on: [self-hosted, macOS, audio]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.9.7
      - name: Install playback dependencies
        run: |
          command -v ffmpeg
          command -v clang
          python -m pip install --upgrade "yt-dlp[default]"
          ffmpeg -version
          ffprobe -version
          yt-dlp --version
          deno --version
      - name: Build
        run: go build -v .
      - name: Audit built-in station resolution
        if: inputs.stations
        run: ./chill doctor --stations
      - name: Verify live YouTube playback
        env:
          STREAM_URL: ${{ inputs.url }}
        run: python scripts/check_macos_playback.py --source "$STREAM_URL"
      - name: Extract YouTube diagnostics on failure
        if: failure()
        env:
          STREAM_URL: ${{ inputs.url }}
        run: yt-dlp --verbose --simulate --no-playlist -- "$STREAM_URL"
