name: YouTube smoke test

# Live extraction depends on YouTube availability and access from hosted runners.
# Keep this explicit external-service check separate from deterministic CI.
on:
  workflow_dispatch:
    inputs:
      url:
        description: YouTube stream URL
        required: true
        default: https://www.youtube.com/watch?v=rFZHOHl-L8A
      stations:
        description: Also check resolution of every built-in station
        type: boolean
        default: true

jobs:
  playback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.9.7
      - name: Install playback dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mpv ffmpeg
          python -m pip install --upgrade "yt-dlp[default]"
          mpv --version
          ffmpeg -version
          yt-dlp --version
          deno --version
      - name: Build
        run: go build -v .
      - name: Audit built-in station resolution
        if: inputs.stations
        run: ./chill doctor --stations
      - name: Verify live YouTube playback
        env:
          STREAM_URL: ${{ inputs.url }}
        run: python .github/scripts/playback.py --youtube "$STREAM_URL"
      - name: Extract YouTube diagnostics on failure
        if: failure()
        env:
          STREAM_URL: ${{ inputs.url }}
        run: yt-dlp --verbose --simulate --no-playlist -- "$STREAM_URL"
